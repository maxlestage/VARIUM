[workspace]
resolver = "3"
members = ["crates/varium-core", "crates/varium-calc", "crates/varium-slides", "crates/varium"]
# Le site de présentation (une app Paquets) a son propre workspace.
exclude = ["site"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/maxlestage/varium"

[workspace.dependencies]
varium-core = { path = "crates/varium-core", version = "0.5.0" }
varium-calc = { path = "crates/varium-calc", version = "0.5.0" }
varium-slides = { path = "crates/varium-slides", version = "0.5.0" }
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = "0.2.39"
rfd = "0.17.2"
log = "0.4.35"
env_logger = "0.11.11"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
