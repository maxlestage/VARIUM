# Teste chaque push. Quand tout est vert, la branche est fusionnée automatiquement
# dans master (sauf master elle-même et les branches nommées wip/...), puis master est
# déployé : le site de présentation sur GitHub Pages (pages.yml),
# et, s'il est configuré, le serveur du site sur Heroku (heroku.yml). Un push fait par
# un workflow n'en démarre aucun autre : ils sont donc lancés explicitement.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  site:
    name: Site (Paquets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  merge:
    name: Fusion dans master
    needs: [check, site]
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Fusionner ${{ github.ref_name }}
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SHA"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "$BRANCH est déjà dans master."
            exit 0
          fi
          git merge --no-ff --no-edit "$SHA" -m "Merge branch '$BRANCH' into master (auto-merge)"
          git push origin HEAD:master
          echo "::notice title=Auto-merge::$BRANCH fusionnée dans master"
      - name: Déployer master (Heroku, GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        # Un workflow qui vient d'arriver sur master peut mettre quelques secondes à être
        # connu de GitHub : on réessaie, et un échec ne fait pas échouer la fusion.
        run: |
          for wf in heroku.yml pages.yml; do
            ok=
            for attempt in 1 2 3 4 5 6; do
              if gh workflow run "$wf" --ref master --repo "$GITHUB_REPOSITORY"; then
                ok=1; echo "$wf lancé."; break
              fi
              sleep $((attempt * 5))
            done
            [ -n "$ok" ] || echo "::warning title=Déploiement::$wf n'a pas pu être lancé (relancez-le depuis l'onglet Actions)."
          done
