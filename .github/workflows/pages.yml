# Publie sur GitHub Pages le site de présentation (site/, exporté en fichiers statiques) :
# https://maxlestage.github.io/VARIUM/, en six langues (/fr/, /en/, /es/, /de/, /it/, /pt/ ;
# la racine choisit la langue du navigateur). Varium n'a pas de version en ligne : c'est une
# application de bureau, installée depuis la page /{langue}/installer/.
#
# Lancé à chaque push sur master, et par la CI après chaque fusion automatique.

name: Site (GitHub Pages)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site -> target
      - uses: actions/configure-pages@v6
        id: pages
      - name: Exporter le site de présentation
        working-directory: site
        env:
          # /VARIUM et https://maxlestage.github.io/VARIUM : chaque lien est derrière la
          # base, chaque URL absolue (canonique, sitemap) sur l'adresse publique.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: cargo run --release -- export dist
      - name: Fichiers publiés
        run: find site/dist -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
