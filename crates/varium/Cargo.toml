[package]
name = "varium"
description = "Varium — éditeur de documents à variables (application de bureau egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "varium"

[dependencies]
varium-core.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_extras = { workspace = true, features = ["datepicker", "serde"] }
jiff.workspace = true
serde.workspace = true
log.workspace = true
rfd.workspace = true

env_logger.workspace = true

