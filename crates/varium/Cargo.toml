[package]
name = "varium"
description = "Varium — éditeur de documents à variables (egui, bureau et web)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "varium"

[dependencies]
varium-core.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_extras = { workspace = true, features = ["datepicker", "serde"] }
jiff.workspace = true
serde.workspace = true
log.workspace = true
rfd.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement",
  "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url",
] }
