[package]
name = "varium"
description = "Varium — éditeur de documents à variables (application de bureau egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "varium"

[dependencies]
varium-core.workspace = true
varium-calc.workspace = true
varium-slides.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_extras = { workspace = true, features = ["datepicker", "serde"] }
jiff.workspace = true
serde.workspace = true
log.workspace = true
rfd.workspace = true

env_logger.workspace = true
spellbook = "0.4.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# Presse-papiers HTML (collage intelligent) ; déjà employé par egui-winit.
arboard = { version = "3.7", default-features = false }


# Barre de menus native de macOS (en haut de l'écran), comme Pages.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }
# Fichiers ouverts depuis le Finder (événement Apple « open documents ») ; même
# version que celle de muda.
objc2 = "0.6"

# Langue du système, pour l'interface (sous Linux : LC_ALL, LC_MESSAGES, LANG).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
sys-locale = "0.3"


[build-dependencies]
winresource = "0.1"
