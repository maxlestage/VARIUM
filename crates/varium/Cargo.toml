[package]
name = "varium"
description = "Varium — éditeur de documents à variables (application de bureau egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "varium"

[dependencies]
varium-core.workspace = true
varium-calc.workspace = true
varium-slides.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_extras = { workspace = true, features = ["datepicker", "serde"] }
jiff.workspace = true
serde.workspace = true
log.workspace = true
rfd.workspace = true

env_logger.workspace = true
spellbook = "0.4.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }


# Barre de menus native de macOS (en haut de l'écran), comme Pages.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

[build-dependencies]
winresource = "0.1"
