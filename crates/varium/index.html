<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Varium</title>
  <meta name="description" content="Varium — Un document. Toutes ses possibilités. Éditeur de documents à variables {{…}}, en Rust.">
  <meta name="theme-color" content="#1f5fbf">
  <link data-trunk rel="rust" data-bin="varium" data-wasm-opt="2">
  <link data-trunk rel="copy-file" href="assets/manifest.json">
  <link data-trunk rel="copy-file" href="assets/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #f3f1ec; --fg: #1d1b18; --accent: #1f5fbf; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1a18; --fg: #ece8e1; --accent: #8ab4f8; } }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
    canvas#varium_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
               font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #loading .logo { font: 700 44px ui-monospace, Menlo, monospace; color: var(--accent); }
    #loading .name { font-size: 26px; font-weight: 600; margin-top: 4px; }
    #loading .tag { opacity: .7; margin-top: 2px; }
    #loading .bar { width: 160px; height: 3px; margin: 18px auto 0; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; border-radius: 2px; }
    #loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <canvas id="varium_canvas"></canvas>
  <div id="loading">
    <div class="logo">{ }</div>
    <div class="name">Varium</div>
    <div class="tag">Un document. Toutes ses possibilités.</div>
    <div class="bar"></div>
    <noscript><p>Varium nécessite JavaScript et WebAssembly.</p></noscript>
  </div>
</body>
</html>
