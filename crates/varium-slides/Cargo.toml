[package]
name = "varium-slides"
description = "Moteur de présentations de Varium : diapositives, dispositions, thèmes, exports HTML/ODP/PDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
varium-core.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml = "0.42.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.8"
# Export en images (PNG) : tracés et polices (déjà employés par egui sous Linux).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2.32"
